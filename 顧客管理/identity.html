<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>DB採番</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>DB採番</h1>

  <div id="msg"></div>

  <fieldset>
    <legend>準備</legend>
    <button id="btn_initTicket" data-then="searchTicket">サンプルテーブルを作成</button>
    <p class="hint">ticket 表の番号は H2 の <code>GENERATED BY DEFAULT AS IDENTITY</code> です。登録 SQL には番号の列を書きません。</p>
  </fieldset>

  <fieldset>
    <legend>検索</legend>
    <label>件名</label><input name="in_titleQ" placeholder="部分一致（空欄で全件）">
    <button id="btn_searchTicket">検索</button>
  </fieldset>

  <fieldset>
    <legend>一覧</legend>
    <div id="out_searchTicket"
         data-fields="番号=id,件名=title"
         data-row-edit="#ticketForm"
         data-row-delete="deleteTicket"
         data-row-then="searchTicket"
         data-row-confirm="この件を削除します。よろしいですか？">（検索ボタンを押してください）</div>
  </fieldset>

  <div id="out_saveTicket"></div>

  <fieldset id="ticketForm">
    <legend>登録</legend>
    <div class="row"><label>番号</label><input name="in_id" data-key data-increment type="number" data-type="int" placeholder="自動採番" disabled></div>
    <div class="row"><label>件名</label><input name="in_title" size="40"></div>
    <div class="actions">
      <button id="btn_saveTicket" data-insert="insertTicket" data-update="updateTicket" data-then="searchTicket">登録</button>
      <button type="button" class="secondary" data-clear="#ticketForm">クリア</button>
    </div>
    <p class="hint">番号は入力しません。登録すると DB が採番した値が入り、ボタンは「更新」になります。</p>
  </fieldset>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>顧客管理（サンプル）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>顧客管理（サンプル）</h1>

  <!-- メッセージ表示欄: id="msg" -->
  <div id="msg"></div>

  <fieldset>
    <legend>準備</legend>
    <!-- btn_initSample → sql/initSample.sql（テーブル作成とサンプルデータ投入） -->
    <button id="btn_initSample" data-then="searchCustomer">サンプルテーブルを作成</button>
  </fieldset>

  <fieldset>
    <legend>検索</legend>
    <!-- name="in_xxx" → SQL の :xxx にバインド -->
    <label>名前</label><input name="in_name" placeholder="部分一致（空欄で全件）">
    <label>都道府県</label>
    <select name="in_pref">
      <option value="">（すべて）</option>
      <option>東京都</option>
      <option>大阪府</option>
      <option>愛知県</option>
      <option>福岡県</option>
    </select>
    <!-- btn_searchCustomer → sql/searchCustomer.sql、結果は out_searchCustomer へ -->
    <button id="btn_searchCustomer">検索</button>
  </fieldset>

  <fieldset>
    <legend>登録</legend>
    <label>顧客ID</label><input name="in_id" type="number" data-type="int" placeholder="空欄で自動採番">
    <label>名前</label><input name="in_newName">
    <label>都道府県</label><input name="in_newPref"><br>
    <label>メール</label><input name="in_email" type="email" size="30">
    <label>登録日</label><input name="in_joinedOn" type="date">
    <!-- data-then: 登録成功後に検索も実行して一覧を更新 -->
    <button id="btn_insertCustomer" data-then="searchCustomer">登録</button>
    <button id="btn_deleteCustomer" class="danger" data-then="searchCustomer"
            data-confirm="入力した顧客IDのデータを削除します。よろしいですか？">顧客IDで削除</button>
    <div id="out_insertCustomer"></div>
    <div id="out_deleteCustomer"></div>
  </fieldset>

  <fieldset>
    <legend>検索結果</legend>
    <div id="out_searchCustomer">（検索ボタンを押してください）</div>
  </fieldset>
</body>
</html>
